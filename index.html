<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Special Day ❤️</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fffaf7;
      color: #473b38;
      font-family: Georgia, serif;
      text-align: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 32px 22px;
      border: 1px solid #e7d7d0;
      border-radius: 18px;
      background: white;
    }

    h1 {
      font-size: 27px;
      font-weight: normal;
    }

    p {
      line-height: 1.8;
    }

    button {
      margin-top: 18px;
      padding: 14px 25px;
      border: none;
      border-radius: 30px;
      background: #8e5c57;
      color: white;
      font-size: 16px;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>For My Love ❤️</h1>
    <p>
      Some moments become memories.<br>
      Some people become home.
    </p>
    <p>Our little story is waiting for you.</p>
    <button onclick="alert('Our story is coming soon ❤️')">
      Open Our Story ❤️
    </button>
  </main>
</body>
</html>
